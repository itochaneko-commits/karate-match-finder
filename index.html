<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root{
    --paper:#f4f1ec;
    --card:#fbf9f5;
    --ink:#1b1a17;
    --muted:#6f6860;
    --line:#ddd6cb;
    --line-strong:#c9c0b2;
    --accent:#c20e2f;
    --accent-ink:#c20e2f;
    --accent-wash:#f6e4e2;
    --good:#1f7a4d;
    --good-wash:#e2efe6;
    --warn:#9a6b16;
    --warn-wash:#f3e9d6;
    --live:#c20e2f;
    --shadow:0 1px 2px rgba(30,24,16,.06),0 6px 20px rgba(30,24,16,.06);
    --jp:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#151417;
      --card:#1e1c20;
      --ink:#ece7de;
      --muted:#9b938a;
      --line:#322f36;
      --line-strong:#454049;
      --accent:#ff4d5e;
      --accent-ink:#ff6b78;
      --accent-wash:#3a1f24;
      --good:#5cc08a;
      --good-wash:#1e3329;
      --warn:#d7a44e;
      --warn-wash:#37301f;
      --live:#ff4d5e;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#151417;
    --card:#1e1c20;
    --ink:#ece7de;
    --muted:#9b938a;
    --line:#322f36;
    --line-strong:#454049;
    --accent:#ff4d5e;
    --accent-ink:#ff6b78;
    --accent-wash:#3a1f24;
    --good:#5cc08a;
    --good-wash:#1e3329;
    --warn:#d7a44e;
    --warn-wash:#37301f;
    --live:#ff4d5e;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--jp);line-height:1.55;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:600px;margin:0 auto;padding:0 16px 72px}

  /* ---- masthead ---- */
  header.mast{padding:26px 0 16px;border-bottom:2px solid var(--ink)}
  .kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-ink);
    font-weight:700;margin:0 0 8px}
  h1{font-size:clamp(20px,5.4vw,27px);font-weight:900;margin:0;letter-spacing:.01em;text-wrap:balance}
  .mast .sub{margin:9px 0 0;color:var(--muted);font-size:13px}
  .mast .sub b{color:var(--ink);font-weight:500}
  .mast .dot{margin:0 7px;opacity:.5}

  /* ---- search ---- */
  .search{position:sticky;top:0;z-index:20;background:var(--paper);
    padding:14px 0 12px;margin-bottom:4px}
  .search::after{content:"";position:absolute;left:-16px;right:-16px;bottom:0;height:1px;background:var(--line)}
  .field{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line-strong);
    border-radius:12px;padding:0 14px;box-shadow:var(--shadow);transition:border-color .15s}
  .field:focus-within{border-color:var(--accent)}
  .field svg{flex:none;width:19px;height:19px;stroke:var(--muted)}
  #q{flex:1;border:0;background:none;color:var(--ink);font-family:var(--jp);font-size:16px;
    padding:13px 0;outline:none;min-width:0}
  #q::placeholder{color:var(--muted)}
  #clear{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px;line-height:1;display:none}
  .hint{margin:9px 2px 0;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
  .hint button{font-family:var(--jp);font-size:12px;color:var(--accent-ink);background:var(--accent-wash);
    border:0;border-radius:999px;padding:3px 10px;cursor:pointer;max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}

  .modes{display:flex;gap:5px;margin-bottom:10px}
  .mode-btn{flex:1;font-family:var(--jp);font-size:12.5px;font-weight:700;color:var(--muted);
    background:var(--card);border:1.5px solid var(--line-strong);border-radius:10px;padding:8px 3px;
    cursor:pointer;white-space:nowrap}
  .mode-btn.on{color:#fff;background:var(--accent);border-color:var(--accent)}

  .subtabs{display:flex;gap:6px;margin:0 0 12px}
  .subtab{flex:1;font-family:var(--jp);font-size:12px;font-weight:700;color:var(--muted);
    background:var(--card);border:1px solid var(--line-strong);border-radius:999px;padding:6px 4px;cursor:pointer}
  .subtab.on{color:#fff;background:var(--ink);border-color:var(--ink)}

  .club-sum{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 14px;font-size:13px;line-height:1.7}
  .club-sum .n{font-family:var(--mono);color:var(--accent-ink);font-weight:500}
  .club-sum .warn-note{color:var(--warn)}
  .clublist{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;justify-content:center}
  .clublist button{font-family:var(--jp);font-size:12.5px;color:var(--ink);background:var(--card);
    border:1px solid var(--line-strong);border-radius:999px;padding:5px 11px;cursor:pointer}
  .clublist-label{margin:16px 0 6px;font-size:11px;color:var(--muted);letter-spacing:.06em}

  .divlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .div-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
    cursor:pointer;font-family:var(--jp);box-shadow:var(--shadow)}
  .div-row:active{border-color:var(--accent)}
  .div-row-name{flex:1;font-size:13.5px;color:var(--ink);line-height:1.4;min-width:0}
  .div-row-meta{flex:none;font-size:11px;color:var(--muted);font-family:var(--mono);text-align:right;white-space:nowrap}
  .back-btn{display:inline-block;font-family:var(--jp);font-size:12.5px;color:var(--accent-ink);
    background:none;border:0;padding:4px 0 10px;cursor:pointer;font-weight:700}
  .tour-card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;margin-top:2px}
  .tour-card-meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .tour-btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--jp);font-weight:700;font-size:15px;
    color:#fff;background:var(--accent);border-radius:12px;padding:14px 28px;text-decoration:none;
    box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
  .tour-btn:active{opacity:.85}
  .tour-empty-note{font-size:13px;color:var(--muted);margin:4px 0}
  .clublist button .c{color:var(--muted);font-family:var(--mono);font-size:11px;margin-left:5px}

  .status-line{display:flex;align-items:center;gap:8px;margin:14px 2px 2px;font-size:12px;color:var(--muted);
    min-height:18px}
  .status-line .pulse{width:7px;height:7px;border-radius:50%;background:var(--good);flex:none;
    box-shadow:0 0 0 0 var(--good);animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 55%,transparent)}
    70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .status-line button{margin-left:auto;font-family:var(--jp);font-size:12px;color:var(--ink);
    background:var(--card);border:1px solid var(--line-strong);border-radius:8px;padding:4px 10px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){.status-line .pulse{animation:none}}

  /* ---- results ---- */
  #out{display:flex;flex-direction:column;gap:18px;margin-top:12px}

  .person{background:var(--card);border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden}
  .person > .p-head{padding:15px 16px 13px;border-bottom:1px solid var(--line)}
  .p-name{margin:0;font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .p-name .kana{font-size:11.5px;font-weight:500;letter-spacing:.08em;color:var(--muted)}
  .p-meta{margin:5px 0 0;font-size:12px;color:var(--muted)}
  .p-meta .sep{margin:0 6px;opacity:.5}

  .bout{padding:14px 16px;display:grid;grid-template-columns:1fr;gap:11px}
  .bout + .bout{border-top:1px dashed var(--line-strong)}
  .b-div{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start;line-height:1.4}
  .cat{flex:none;font-weight:700;color:var(--ink);background:var(--paper);border:1px solid var(--line-strong);
    border-radius:6px;padding:1px 7px;font-size:11px;letter-spacing:.04em}

  .coord{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
  .coord .box{background:var(--paper);border:1px solid var(--line-strong);border-radius:10px;
    padding:7px 12px 6px;display:flex;flex-direction:column;align-items:center;min-width:62px}
  .coord .box .lab{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .coord .box .val{font-family:var(--mono);font-size:19px;font-weight:500;color:var(--ink);line-height:1.2}
  .coord .box.num{background:var(--accent);border-color:var(--accent)}
  .coord .box.num .lab{color:rgba(255,255,255,.82)}
  .coord .box.num .val{color:#fff;font-size:24px}

  .vs{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:14px}
  .vs .vs-lbl{color:var(--muted);font-size:12px;flex:none}
  .vs .rnd{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent-ink);
    background:var(--accent-wash);border-radius:5px;padding:1px 7px;flex:none}
  .vs .rnd:empty{display:none}
  .vs .opp{font-weight:700;font-size:15.5px}
  .vs .opp .team{font-weight:400;font-size:12px;color:var(--muted);margin-left:4px}
  .vs .opp.tbd{font-weight:500;color:var(--muted)}

  .b-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:3px 10px}
  .chip.sched{background:var(--paper);color:var(--muted);border:1px solid var(--line-strong)}
  .chip.live{background:var(--accent-wash);color:var(--accent-ink)}
  .chip.live::before{content:"● ";font-size:9px;vertical-align:1px}
  .chip.win{background:var(--good-wash);color:var(--good)}
  .chip.lose{background:var(--warn-wash);color:var(--warn)}
  .chip.done{background:var(--paper);color:var(--muted);border:1px solid var(--line-strong)}
  .b-foot a{margin-left:auto;font-size:12px;color:var(--accent-ink);text-decoration:none;font-weight:700;
    border-bottom:1px solid color-mix(in srgb,var(--accent-ink) 35%,transparent);padding-bottom:1px}
  .b-foot a:hover{border-bottom-color:var(--accent-ink)}

  .grp-note{font-size:11px;color:var(--muted);margin-top:-2px}
  .grp-note b{color:var(--ink);font-weight:500}

  /* ---- states ---- */
  .empty,.msg{text-align:center;color:var(--muted);padding:34px 16px;font-size:13px}
  .empty h2{color:var(--ink);font-size:15px;font-weight:700;margin:0 0 8px}
  .empty .ex{margin-top:14px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .empty .ex button{font-family:var(--jp);font-size:13px;color:var(--ink);background:var(--card);
    border:1px solid var(--line-strong);border-radius:999px;padding:6px 13px;cursor:pointer}
  .skeleton{background:var(--card);border:1px solid var(--line);border-radius:16px;height:126px;
    position:relative;overflow:hidden}
  .skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ink) 6%,transparent),transparent);
    animation:sweep 1.3s infinite}
  @keyframes sweep{100%{transform:translateX(100%)}}
  @media (prefers-reduced-motion:reduce){.skeleton::after{animation:none}}

  footer.foot{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11px;color:var(--muted);line-height:1.7}
  footer.foot a{color:var(--accent-ink)}
  .err{background:var(--warn-wash);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);
    border-radius:10px;padding:11px 13px;font-size:12.5px;margin-top:12px}
</style>
</head>
<body>

<div class="wrap">
  <header class="mast">
    <p class="kicker">出場試合ファインダー</p>
    <h1 id="compName">大会データを読み込み中…</h1>
    <p class="sub" id="compSub"></p>
  </header>

  <div class="search">
    <div class="modes" role="tablist">
      <button id="mNameBtn" class="mode-btn on" type="button" role="tab" aria-selected="true">選手名</button>
      <button id="mClubBtn" class="mode-btn" type="button" role="tab" aria-selected="false">所属</button>
      <button id="mTourBtn" class="mode-btn" type="button" role="tab" aria-selected="false">階級・型/組手</button>
    </div>
    <label class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false"
        placeholder="選手名で検索（漢字・カナ）" aria-label="検索">
      <button id="clear" aria-label="クリア">&times;</button>
    </label>
    <div class="hint" id="hint"></div>
  </div>

  <div class="status-line" id="statusLine" hidden>
    <span class="pulse"></span>
    <span id="statusText">読み込み中…</span>
    <button id="refresh" type="button">更新</button>
  </div>

  <div id="out"></div>

  <footer class="foot">
    <div><b>karate-network.com</b> の公開データ（大会情報 / コート進行）をそのまま表示する非公式の補助ツールです。組み合わせ・コート進行・対戦結果は運営の操作により随時変動します。正式な情報は会場アナウンスと
    <a id="officialLink" href="https://karate-network.com/public/competitions/50" target="_blank" rel="noopener">公式ページ</a> をご確認ください。</div>
    <div id="dataStamp" style="margin-top:6px"></div>
  </footer>
</div>

<script>
const COMP_ID = 50;
const BASE = "https://karate-network.com";
const $ = s => document.querySelector(s);

const state = {
  entries: [],          // searchable rows
  byGroupKey: new Map(),
  tourByDiv: new Map(),  // divId -> {id,size}
  matchesByEntry: new Map(), // entryId -> [match]
  fields: [],
  pmCache: new Map(),    // "entryId/divId" -> [pm rows]
  loadedCompetition: false,
  lastMatchLoad: null,
  q: "",
  mode: "name",          // "name" | "club" | "tour"
  clubs: [],             // [{label, people, nk}]  -- 支部・道場（優先所属）
  orgs: [],              // [{label, people, nk}]  -- 流派・団体（organization）
  divisions: [],         // [{id, name, cat, sortOrder, entrants, tourId, tourSize, nk}]
  tourCat: "all",        // "all" | "kumite" | "kata"
  tourSelectedDiv: null,
};

/* ---------- text helpers ---------- */
const kata2hira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const norm = s => (s || "").normalize("NFKC").replace(/[\s　・·,、。･]/g, "").toLowerCase();
const nameKey = s => norm(s);
const kanaKey = s => kata2hira(norm(s));
const esc = s => (s == null ? "" : String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])));

function shortDiv(name){
  return (name || "").replace(/^（(組手|型)）\s*/, "").replace(/^【[^】]*】/, "").trim();
}
function catOf(name){
  if (/型/.test(name || "")) return "型";
  return "組手";
}
function fmtTime(d){
  return d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
}
function fmtDate(s){
  if (!s) return "";
  const m = String(s).match(/(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[1]}年${+m[2]}月${+m[3]}日` : String(s);
}

/* ---------- data load ---------- */
async function loadAll(){
  $("#statusLine").hidden = false;
  $("#statusText").textContent = "大会データを読み込み中…";
  renderSkeleton();
  const results = await Promise.allSettled([
    fetch(`${BASE}/api/public/competitions/${COMP_ID}`).then(r => r.ok ? r.json() : Promise.reject(r.status)),
    fetch(`${BASE}/api/public/competitions/${COMP_ID}/match-progress`).then(r => r.ok ? r.json() : Promise.reject(r.status)),
  ]);
  const comp = results[0].status === "fulfilled" ? results[0].value : null;
  const mp = results[1].status === "fulfilled" ? results[1].value : null;

  if (!mp && !comp){
    $("#out").innerHTML = `<div class="err">
      <b>大会データを取得できませんでした。</b><br>
      ・通信環境を確認して「更新」を押してください。<br>
      ・この HTML ファイルを直接ブラウザで開くか、静的サイトとして公開してご利用ください（一部の環境では外部データの取得がブロックされます）。
    </div>`;
    $("#statusText").textContent = "取得失敗";
    return;
  }
  if (comp) applyCompetition(comp);
  if (mp) applyMatchProgress(mp);
  buildIndex(comp, mp);
  state.lastMatchLoad = new Date();
  updateStatus();
  render();
}

async function refreshMatches(){
  $("#statusText").textContent = "コート進行を更新中…";
  try{
    const mp = await fetch(`${BASE}/api/public/competitions/${COMP_ID}/match-progress`).then(r => r.ok ? r.json() : Promise.reject(r.status));
    applyMatchProgress(mp);
    if (!state.entries.length) buildIndex(null, mp);  // roster is static during the event; only matches change
    state.pmCache.clear();
    state.lastMatchLoad = new Date();
    render();
  }catch(e){ /* keep old data */ }
  updateStatus();
}

function applyCompetition(comp){
  state.loadedCompetition = true;
  const name = comp.name || comp.data?.name;
  $("#compName").textContent = name || "大会";
  const parts = [];
  const d = fmtDate(comp.start_date), d2 = fmtDate(comp.end_date);
  if (d) parts.push(`<b>${esc(d + (d2 && d2 !== d ? "〜" + d2 : ""))}</b>`);
  if (comp.venue) parts.push(esc(comp.venue));
  if (comp.host) parts.push(esc(comp.host));
  $("#compSub").innerHTML = parts.join('<span class="dot">/</span>');
  $("#officialLink").href = `${BASE}/public/competitions/${COMP_ID}`;

  (comp.tournaments || []).forEach(t => {
    if (t.division_id != null) state.tourByDiv.set(t.division_id, { id: t.id, size: t.tournament_size });
  });
}

function applyMatchProgress(mp){
  state.fields = mp.fields || [];
  state.mpEntries = mp.entries || {};
  state.mpDivisions = mp.divisions || {};
  // matchesByEntry
  const map = new Map();
  for (const row of (mp.matches || [])){
    const [matchId, node, disp, group, court, tid, e1, e2, winner] = row;
    const m = { matchId, node, disp: String(disp), group: String(group), court: String(court), tid, e1, e2, winner };
    if (e1 != null){ if (!map.has(e1)) map.set(e1, []); map.get(e1).push(m); }
    if (e2 != null){ if (!map.has(e2)) map.set(e2, []); map.get(e2).push(m); }
  }
  state.matchesByEntry = map;
}

function buildIndex(comp, mp){
  // Prefer competition entries (kana + bio); fall back to match-progress entries.
  const rows = [];
  if (comp && Array.isArray(comp.entries) && comp.entries.length){
    for (const e of comp.entries){
      const div = e.division || {};
      const t = state.tourByDiv.get(e.division_id);
      rows.push({
        id: e.id,
        pid: e.player_id,
        name: e.player_name || "",
        kana: e.player_name_kana || "",
        org: e.organization || e.branch || "",
        branch: e.branch || "",
        cls: e.class || e.grade || "",
        age: e.age,
        gender: e.gender,
        divId: e.division_id,
        divName: div.division_name || state.mpDivisions?.[t?.id] || "",
        cat: div.category === "kata" ? "型" : (div.event_type === "kata" ? "型" : "組手"),
        tourId: t?.id ?? null,
        tourSize: t?.size ?? null,
      });
    }
  } else if (state.mpEntries){
    for (const [id, v] of Object.entries(state.mpEntries)){
      rows.push({ id: +id, pid: null, name: v.n || "", kana: "", org: v.o || v.b || "", branch: v.b || "",
        cls: "", age: null, gender: null, divId: null, divName: "", cat: "組手", tourId: null, tourSize: null });
    }
  } else if (!state.entries.length){
    return;
  } else {
    return; // keep existing index on a matches-only refresh
  }
  for (const r of rows){
    r.nk = nameKey(r.name);
    r.kk = kanaKey(r.kana);
    r.ok = nameKey(r.org);
    r.club = r.branch || r.org || "";
    r.clk = norm(r.club);
  }
  state.entries = rows;

  // distinct affiliations, counting people (not entries)
  // .club = 支部・道場（優先表示用、あれば支部）／ .org = 流派・団体（連盟名）
  const cmap = new Map(), omap = new Map();
  for (const r of rows){
    const pkey = r.pid ? "p" + r.pid : "n:" + r.nk + "|" + r.ok;
    if (r.club){
      if (!cmap.has(r.club)) cmap.set(r.club, new Set());
      cmap.get(r.club).add(pkey);
    }
    if (r.org){
      if (!omap.has(r.org)) omap.set(r.org, new Set());
      omap.get(r.org).add(pkey);
    }
  }
  const byPeopleDesc = (a, b) => b.people - a.people || a.label.localeCompare(b.label, "ja");
  state.clubs = [...cmap.entries()].map(([label, set]) => ({ label, people: set.size, nk: norm(label) })).sort(byPeopleDesc);
  state.orgs = [...omap.entries()].map(([label, set]) => ({ label, people: set.size, nk: norm(label) })).sort(byPeopleDesc);

  // division list for the 階級・トーナメント mode (needs the richer competition payload)
  if (comp && Array.isArray(comp.divisions)){
    const countByDiv = new Map();
    for (const r of rows) countByDiv.set(r.divId, (countByDiv.get(r.divId) || 0) + 1);
    state.divisions = comp.divisions.map(d => {
      const t = state.tourByDiv.get(d.id);
      return {
        id: d.id,
        name: d.division_name || "",
        cat: d.category === "kata" ? "型" : "組手",
        sortOrder: d.sort_order ?? 9999,
        entrants: countByDiv.get(d.id) || 0,
        tourId: t?.id ?? null,
        tourSize: t?.size ?? null,
        nk: norm(d.division_name || ""),  // search the raw name so nothing (level, etc.) is lost
      };
    }).sort((a, b) => a.sortOrder - b.sortOrder);
  }
}

/* ---------- search + render ---------- */
function search(q){
  const nq = kanaKey(q);
  if (!nq) return [];
  const hits = state.entries.filter(r =>
    r.nk.includes(nq) || (r.kk && r.kk.includes(nq)) || kanaKey(r.name).includes(nq)
  );
  // group by person
  const groups = new Map();
  for (const r of hits){
    const key = r.pid ? "p" + r.pid : "n:" + r.nk + "|" + r.ok;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  return [...groups.values()].sort((a, b) => a[0].nk.localeCompare(b[0].nk, "ja"));
}

// sort weight for a bout: 進行グループ → コート → 試合番号
function coordVal(m){
  const g = parseInt(m.group, 10), c = parseInt(m.court, 10), d = parseInt(m.disp, 10);
  return (isNaN(g) ? 99 : g) * 1e6 + (isNaN(c) ? 99 : c) * 1e3 + (isNaN(d) ? 999 : d);
}
function earliestCoord(rowOrGroup){
  const rows = Array.isArray(rowOrGroup) ? rowOrGroup : [rowOrGroup];
  let best = Infinity;
  for (const r of rows)
    for (const m of (state.matchesByEntry.get(r.id) || [])) best = Math.min(best, coordVal(m));
  return best;
}

function searchClub(q){
  const nq = norm(q);
  if (!nq) return [];
  // 支部・道場（.clk）と流派・団体（.ok）の両方を対象にする
  const hits = state.entries.filter(r => (r.clk && r.clk.includes(nq)) || (r.ok && r.ok.includes(nq)));
  const groups = new Map();
  for (const r of hits){
    const key = r.pid ? "p" + r.pid : "n:" + r.nk + "|" + r.ok;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  return [...groups.values()].sort((a, b) =>
    earliestCoord(a) - earliestCoord(b) || a[0].nk.localeCompare(b[0].nk, "ja"));
}

function searchDivisions(q, cat){
  let list = state.divisions;
  if (cat !== "all") list = list.filter(d => (cat === "kata" ? d.cat === "型" : d.cat === "組手"));
  const nq = norm(q);
  if (nq) list = list.filter(d => d.nk.includes(nq));
  return list;
}

function roundLabel(n){
  if (!n) return "";
  return n + "回戦";
}

function boutHTML(r){
  const ms = state.matchesByEntry.get(r.id) || [];
  // choose the player's "current/next" match: prefer one without a winner, else earliest node
  let m = ms.find(x => x.winner == null) || ms[0];
  const tourId = r.tourId;
  const bracketA = tourId
    ? `<a href="${BASE}/tournament-public/${tourId}" target="_blank" rel="noopener">トーナメント表 ↗</a>` : "";

  const catBadge = `<span class="cat">${esc(r.cat)}</span>`;
  const divLine = `<div class="b-div">${catBadge}<span>${esc(shortDiv(r.divName) || r.divName || "階級情報なし")}</span></div>`;

  if (!m){
    return `<div class="bout" data-eid="${r.id}" data-did="${r.divId ?? ""}">
      ${divLine}
      <div class="vs"><span class="opp tbd">試合の割り当てがまだありません</span></div>
      <div class="b-foot">${bracketA}</div>
    </div>`;
  }

  // opponent
  const oppId = m.e1 === r.id ? m.e2 : m.e1;
  let oppHTML;
  if (oppId == null){
    oppHTML = `<span class="opp tbd">対戦相手未定（シード / 勝ち上がり待ち）</span>`;
  } else {
    const o = entryBrief(oppId);
    oppHTML = `<span class="opp">${esc(o.name || "―")}${o.org ? `<span class="team">${esc(o.org)}</span>` : ""}</span>`;
  }

  // status / result
  let chip = `<span class="chip sched" data-role="chip">試合予定</span>`;
  if (m.winner != null){
    chip = m.winner === r.id
      ? `<span class="chip win" data-role="chip">勝ち</span>`
      : `<span class="chip lose" data-role="chip">敗退</span>`;
  }

  return `<div class="bout" data-eid="${r.id}" data-did="${r.divId ?? ""}" data-court="${esc(m.court)}" data-disp="${esc(m.disp)}">
    ${divLine}
    <div class="coord">
      <span class="box"><span class="lab">コート</span><span class="val">${esc(m.court)}</span></span>
      <span class="box num"><span class="lab">何試合目</span><span class="val">${esc(m.disp)}</span></span>
      <span class="box"><span class="lab">進行 G</span><span class="val">${esc(m.group)}</span></span>
    </div>
    <div class="vs">
      <span class="rnd" data-role="rnd"></span>
      <span class="vs-lbl">対</span>
      ${oppHTML}
    </div>
    <p class="grp-note"><b>${esc(m.court)}</b> コートの <b>${esc(m.disp)}</b> 試合目（第 <b>${esc(m.group)}</b> 進行グループ）<span data-role="mine"></span></p>
    <div class="b-foot">${chip}${bracketA}</div>
  </div>`;
}

function entryBrief(id){
  const r = state.entries.find(x => x.id === id);
  if (r) return { name: r.name, org: r.club || r.org };
  const v = state.mpEntries?.[id];
  return v ? { name: v.n, org: v.b || v.o || "" } : { name: "", org: "" };
}

function personHTML(group){
  const head = group[0];
  const kana = head.kana ? `<span class="kana">${esc(head.kana)}</span>` : "";
  const meta = [head.club || head.org, head.age ? head.age + "歳" : "", head.cls]
    .filter(Boolean).map(esc).join('<span class="sep">/</span>');
  const bouts = group
    .slice()
    .sort((a, b) => earliestCoord(a) - earliestCoord(b)
      || (a.cat).localeCompare(b.cat) || (a.divName || "").localeCompare(b.divName || "", "ja"))
    .map(boutHTML).join("");
  return `<article class="person">
    <div class="p-head">
      <h2 class="p-name">${esc(head.name)} ${kana}</h2>
      ${meta ? `<p class="p-meta">${meta}</p>` : ""}
    </div>
    ${bouts}
  </article>`;
}

function render(){
  const q = state.q.trim();
  $("#clear").style.display = q ? "block" : "none";
  renderHint();
  const out = $("#out");

  if (state.mode === "tour"){
    renderTourView(q);
    return;
  }

  if (!q){
    out.innerHTML = state.mode === "club" ? clubEmptyState() : emptyState();
    bindExamples();
    return;
  }
  if (!state.entries.length){
    out.innerHTML = `<div class="msg">データ読み込み中です…</div>`;
    return;
  }

  if (state.mode === "club"){
    const allGroups = searchClub(q);
    if (!allGroups.length){
      out.innerHTML = `<div class="empty"><h2>「${esc(q)}」に一致する所属が見つかりません</h2>
        <div>支部名・道場名・流派名の一部で試してください（例：東横浜、江戸川、新極真会）。</div></div>`;
      return;
    }
    const CAP = 150;
    const groups = allGroups.slice(0, CAP);
    const bouts = groups.reduce((n, g) => n + g.length, 0);
    const capNote = allGroups.length > CAP
      ? `<br><span class="warn-note" style="font-size:11.5px">該当が多いため上位${CAP}名のみ表示中。支部名・道場名などでさらに絞り込んでください。</span>` : "";
    out.innerHTML =
      `<div class="club-sum">「<b>${esc(q)}</b>」に一致：<span class="n">${allGroups.length}</span> 名 ／ 表示中 延べ <span class="n">${bouts}</span> 出場<br>
       <span style="color:var(--muted);font-size:11.5px">進行の早い順（進行グループ → コート → 試合番号）で表示</span>${capNote}</div>`
      + groups.map(personHTML).join("");
    enrichVisible();
    return;
  }

  const groups = search(q);
  if (!groups.length){
    out.innerHTML = `<div class="empty"><h2>「${esc(q)}」に一致する選手が見つかりません</h2>
      <div>漢字フルネームの一部、またはフリガナで試してください。<br>（姓だけ・名だけでも検索できます）</div></div>`;
    return;
  }
  out.innerHTML = groups.map(personHTML).join("");
  enrichVisible();
}

/* ---------- tour (階級・型/組手) mode ---------- */
function renderTourView(q){
  const out = $("#out");
  if (state.tourSelectedDiv != null){
    renderTourDetail(state.tourSelectedDiv);
    return;
  }
  if (!state.divisions.length){
    out.innerHTML = state.entries.length
      ? `<div class="msg">階級一覧を取得できませんでした（大会情報の読み込みに失敗した可能性があります）。</div>`
      : `<div class="msg">データ読み込み中です…</div>`;
    return;
  }
  const list = searchDivisions(q, state.tourCat);
  const filtered = !!q || state.tourCat !== "all";
  out.innerHTML = tourSubtabsHTML() + tourListHTML(list, filtered);
  bindTourEvents();
}

function tourSubtabsHTML(){
  const cats = [["all", "すべて"], ["kumite", "組手"], ["kata", "型"]];
  return `<div class="subtabs">` +
    cats.map(([k, label]) => `<button class="subtab${state.tourCat === k ? " on" : ""}" data-cat="${k}" type="button">${label}</button>`).join("") +
    `</div>`;
}

function tourListHTML(list, filtered){
  if (!list.length){
    return `<div class="empty"><h2>該当する階級が見つかりません</h2>
      <div>キーワードを変えて試してください（例：中学生、軽量級、女子、上級）。</div></div>`;
  }
  const rows = list.map(d => `
    <button class="div-row" data-div="${d.id}" type="button">
      <span class="cat">${esc(d.cat)}</span>
      <span class="div-row-name">${esc(shortDiv(d.name))}</span>
      <span class="div-row-meta">${d.entrants}名${d.tourSize ? ` ／ ${d.tourSize}枠` : ""}</span>
    </button>`).join("");
  return `<div class="club-sum">${filtered ? `該当 <span class="n">${list.length}</span> 階級` : `全 <span class="n">${list.length}</span> 階級（進行プログラム順）`}</div>
    <div class="divlist">${rows}</div>`;
}

function bindTourEvents(){
  document.querySelectorAll(".subtab").forEach(b =>
    b.onclick = () => { state.tourCat = b.dataset.cat; render(); });
  document.querySelectorAll(".div-row").forEach(b =>
    b.onclick = () => { state.tourSelectedDiv = +b.dataset.div; render(); });
}

function renderTourDetail(divId){
  const out = $("#out");
  const d = state.divisions.find(x => x.id === divId);
  if (!d){ state.tourSelectedDiv = null; render(); return; }
  const cta = d.tourId
    ? `<a class="tour-btn" href="${BASE}/tournament-public/${d.tourId}" target="_blank" rel="noopener">
         トーナメント表を見る ↗
       </a>`
    : `<p class="tour-empty-note">この階級のトーナメント表はまだ準備中です</p>`;
  out.innerHTML = `
    <div>
      <button class="back-btn" id="tourBack" type="button">← 階級一覧に戻る</button>
      <div class="b-div"><span class="cat">${esc(d.cat)}</span><span>${esc(shortDiv(d.name))}</span></div>
    </div>
    <div class="tour-card">
      <div class="tour-card-meta">
        <span>参加 <span class="n">${d.entrants}</span> 名</span>
        ${d.tourSize ? `<span>／ トーナメント枠 <span class="n">${d.tourSize}</span></span>` : ""}
      </div>
      ${cta}
    </div>`;
  const back = $("#tourBack");
  if (back) back.onclick = () => { state.tourSelectedDiv = null; render(); };
}

function renderHint(){
  const h = $("#hint");
  if (state.mode === "club"){
    const cs = state.clubs.slice(0, 6);
    h.innerHTML = `<span>よく出る所属：</span>` +
      cs.map(c => `<button data-ex="${esc(c.label)}">${esc(c.label)}</button>`).join("");
  } else if (state.mode === "tour"){
    h.innerHTML = `<span>例：</span>` +
      `<button data-ex="中学生">中学生</button><button data-ex="軽量級">軽量級</button>` +
      `<button data-ex="女子">女子</button><button data-ex="上級">上級</button>`;
  } else {
    h.innerHTML = `<span>例：</span>` +
      `<button data-ex="長岡">長岡</button><button data-ex="さとう">さとう</button><button data-ex="タナカ">タナカ</button>`;
  }
  bindExamples();
}

function emptyState(){
  return `<div class="empty">
    <h2>名前を入力すると出場試合が表示されます</h2>
    <div>「何試合目」＝そのコート・進行グループ内での順番。<br>コート番号・進行グループ・回戦・対戦相手・トーナメント表へのリンクが出ます。</div>
    <div class="ex">
      <button data-ex="長岡">長岡</button>
      <button data-ex="鈴木">鈴木</button>
      <button data-ex="やまだ">やまだ</button>
      <button data-ex="ケンタ">ケンタ</button>
    </div>
  </div>`;
}

function clubEmptyState(){
  const list = state.clubs.slice(0, 40)
    .map(c => `<button data-ex="${esc(c.label)}">${esc(c.label)}<span class="c">${c.people}</span></button>`)
    .join("");
  const orgList = state.orgs.slice(0, 12)
    .map(c => `<button data-ex="${esc(c.label)}">${esc(c.label)}<span class="c">${c.people}</span></button>`)
    .join("");
  return `<div class="empty">
    <h2>所属（支部・道場・流派）で出場者をまとめて表示</h2>
    <div>下から選ぶか、支部名・道場名・流派名を入力してください。<br>その所属の選手が「進行の早い順」で一覧表示されます。</div>
    <div class="clublist">${list || "（データ読み込み中…）"}</div>
    ${state.orgs.length ? `<p class="clublist-label">流派・団体で絞り込む</p><div class="clublist">${orgList}</div>` : ""}
  </div>`;
}

/* ---------- per-bout enrichment (round + "自分のN試合目" + live status) ---------- */
async function enrichVisible(){
  const bouts = [...document.querySelectorAll(".bout[data-court]")].slice(0, 24);
  for (const el of bouts){
    const eid = el.dataset.eid, did = el.dataset.did;
    if (!did) continue;
    const key = eid + "/" + did;
    try{
      let rows = state.pmCache.get(key);
      if (!rows){
        rows = await fetch(`${BASE}/api/public/player-matches/${eid}/${did}`)
          .then(r => r.ok ? r.json() : null).then(j => j?.matches || []);
        state.pmCache.set(key, rows);
      }
      const mine = rows.find(x => String(x.venue_number) === el.dataset.court
        && String(x.display_match_number) === el.dataset.disp) || rows[0];
      if (!mine) continue;
      const rnd = el.querySelector('[data-role="rnd"]');
      if (rnd && mine.round) rnd.textContent = roundLabel(mine.round);
      const mineEl = el.querySelector('[data-role="mine"]');
      if (mineEl && mine.match_title) mineEl.textContent = " ／ あなたの" + mine.match_title;
      const chip = el.querySelector('[data-role="chip"]');
      if (chip && !chip.classList.contains("win") && !chip.classList.contains("lose")){
        if (mine.status === "in_progress"){ chip.className = "chip live"; chip.textContent = "進行中"; }
        else if (mine.status === "completed"){ chip.className = "chip done"; chip.textContent = "終了"; }
      }
    }catch(e){ /* ignore */ }
  }
}

/* ---------- misc ui ---------- */
function renderSkeleton(){
  $("#out").innerHTML = Array.from({ length: 3 }, () => `<div class="skeleton"></div>`).join("");
}
function updateStatus(){
  const t = state.lastMatchLoad ? fmtTime(state.lastMatchLoad) : "―";
  $("#statusText").textContent = `コート進行 最終更新 ${t} ・ 30秒ごとに自動更新`;
  $("#dataStamp").textContent = `データ取得: ${state.lastMatchLoad ? state.lastMatchLoad.toLocaleString("ja-JP") : "―"} / 大会ID ${COMP_ID}`;
}
function setQuery(v){
  $("#q").value = v;
  state.q = v;
  render();
  $("#q").focus();
}
function bindExamples(){
  document.querySelectorAll("[data-ex]").forEach(b => b.onclick = () => setQuery(b.dataset.ex));
}
const PLACEHOLDERS = {
  name: "選手名で検索（漢字・カナ）",
  club: "支部名・道場名・流派名で検索",
  tour: "階級名で検索（例：中学生 女子 軽量級）",
};
function setMode(m){
  if (state.mode === m) return;
  state.mode = m;
  $("#mNameBtn").classList.toggle("on", m === "name");
  $("#mClubBtn").classList.toggle("on", m === "club");
  $("#mTourBtn").classList.toggle("on", m === "tour");
  $("#mNameBtn").setAttribute("aria-selected", m === "name");
  $("#mClubBtn").setAttribute("aria-selected", m === "club");
  $("#mTourBtn").setAttribute("aria-selected", m === "tour");
  $("#q").placeholder = PLACEHOLDERS[m];
  state.q = "";
  $("#q").value = "";
  state.tourSelectedDiv = null;
  render();
}

let deb;
$("#q").addEventListener("input", e => {
  state.q = e.target.value;
  if (state.mode === "tour") state.tourSelectedDiv = null;
  clearTimeout(deb);
  deb = setTimeout(render, 120);
});
$("#clear").onclick = () => {
  state.q = ""; $("#q").value = "";
  if (state.mode === "tour") state.tourSelectedDiv = null;
  render(); $("#q").focus();
};
$("#refresh").onclick = refreshMatches;
$("#mNameBtn").onclick = () => setMode("name");
$("#mClubBtn").onclick = () => setMode("club");
$("#mTourBtn").onclick = () => setMode("tour");
renderHint();

loadAll();
setInterval(() => { if (!document.hidden) refreshMatches(); }, 30000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.lastMatchLoad && Date.now() - state.lastMatchLoad > 30000) refreshMatches();
});
</script>
